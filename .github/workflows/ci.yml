name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: healtrip
          POSTGRES_PASSWORD: healtrip
          POSTGRES_DB: healtrip_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U healtrip -d healtrip_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run typecheck
      - name: Tests (in-memory store)
        run: npm test
      - name: Tests (PostgreSQL)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://healtrip:healtrip@localhost:5432/healtrip_test
      - name: Migrations apply cleanly
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://healtrip:healtrip@localhost:5432/healtrip_test
      - run: npm run eval
      - run: npm run build
